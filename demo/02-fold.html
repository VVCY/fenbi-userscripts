<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>演示 02 · 粉笔自由折叠</title>
<style>
  :root{
    --blue:#3C7CFC;
    --blue-deep:#2E6AE8;
    --blue-soft:#EFF2FE;
    --ink:#32343A;
    --ink-2:#636E92;
    --ink-3:#AFB6BC;
    --line:#E9EDF4;
    --grey:#F5F7FA;
    --ok:#2BC8A0;
    --bad:#FF5A5A;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    padding:34px 20px 54px;
    background:#EEF2F7;
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:960px;margin:0 auto}

  /* 被作品集页面以 iframe 嵌入时：去掉标题与留白，画面铺满整块 */
  body.embed{padding:0;background:transparent}
  body.embed .head{display:none}
  body.embed .wrap{max-width:none;margin:0}
  body.embed .scene{
    position:fixed;inset:0;aspect-ratio:auto;border-radius:0;border:0;box-shadow:none;
  }

  .head{margin:0 0 16px}
  .head h1{font-size:19px;font-weight:600;margin:0 0 7px;letter-spacing:-.01em}
  .head p{font-size:13px;line-height:1.7;color:var(--ink-2);margin:0}
  .head b{color:var(--blue);font-weight:600}

  .scene{
    position:relative;aspect-ratio:16/10;border-radius:16px;overflow:hidden;
    background:#fff;border:1px solid rgba(50,52,58,.08);
    box-shadow:0 1px 2px rgba(50,52,58,.05),0 18px 40px -24px rgba(50,52,58,.5);
  }
  .stage{position:absolute;inset:0;container-type:size}
  .stage-in{position:absolute;inset:0;font-size:3.15cqw}

  /* 顶栏 */
  .appbar{
    position:absolute;top:0;left:0;right:0;height:2.3em;
    display:flex;align-items:center;gap:.65em;padding:0 1em;
    background:#fff;border-bottom:.06em solid var(--line);
    font-size:.7em;color:var(--ink-2);z-index:6;
  }
  .appbar .back{color:var(--blue)}
  .appbar .ttl{color:var(--ink);font-weight:500}
  .appbar .done{
    color:var(--ok);background:rgba(43,200,160,.1);
    border-radius:.35em;padding:.2em .55em;font-size:.95em;
  }
  .appbar .sp{flex:1}
  .appbar .clock{font-variant-numeric:tabular-nums;background:var(--grey);border-radius:.35em;padding:.22em .5em}

  /* 标签 + 开关行 */
  .tabsrow{
    position:absolute;top:2.3em;left:0;right:0;height:1.9em;
    display:flex;align-items:center;gap:.9em;padding:0 1em;
    background:#fff;border-bottom:.06em solid var(--line);
    font-size:.62em;color:var(--ink-3);z-index:6;
  }
  .tabsrow .tab.on{color:var(--blue);font-weight:600}
  .tabsrow .sp{flex:1}
  .switches{display:flex;gap:.26em}
  .sw{
    display:flex;align-items:center;gap:.3em;white-space:nowrap;
    padding:.28em .56em;border-radius:2em;
    border:.07em solid var(--line);background:#fff;color:var(--ink-3);
    font-size:.98em;opacity:0;
  }
  .sw .d{width:.42em;height:.42em;border-radius:50%;background:var(--ink-3);flex:none}
  .sw.on{background:var(--blue-soft);border-color:rgba(60,124,252,.35);color:var(--blue-deep);font-weight:600}
  .sw.on .d{background:var(--blue)}

  /* 内容 */
  .paper{
    position:absolute;left:0;right:0;top:4.2em;bottom:2em;
    padding:.2em 1.6em 0;overflow:hidden;
  }
  .scroller{position:relative;will-change:transform}
  .q{padding-bottom:.3em;border-bottom:.06em solid var(--line);margin-bottom:.25em;overflow:hidden}
  .qhead{display:flex;align-items:center;gap:.5em;font-size:.7em;line-height:2}
  .qhead .no{color:var(--blue);font-weight:700;font-size:1.05em}
  .qhead .rate{
    color:var(--ink-2);background:var(--grey);
    border-radius:.35em;padding:.15em .5em;
    font-variant-numeric:tabular-nums;
  }
  .qhead .rate b{color:var(--ink);font-weight:600;margin-left:.2em}
  .qhead .sp{flex:1}
  .qhead .wrongtag{
    color:var(--bad);background:rgba(255,90,90,.09);
    border-radius:.35em;padding:.15em .5em;font-size:.92em;
  }

  .blk{overflow:hidden}
  .stem{font-size:.72em;line-height:1.75;color:var(--ink);padding-top:.2em}
  .blank{display:inline-block;width:1.7em;border-bottom:.07em solid var(--ink-3);vertical-align:-.12em;margin:0 .1em}
  .opts{
    font-size:.68em;line-height:1.8;color:var(--ink-2);
    display:grid;grid-template-columns:1fr 1fr;gap:.1em 1.2em;
    padding:.3em 0 .15em;
  }
  .opts i{font-style:normal;color:var(--ink-3);margin-right:.3em}
  .opts .pick{color:var(--bad);font-weight:600}
  .opts .pick i{color:var(--bad)}
  .opts .right{color:var(--ok);font-weight:600}
  .opts .right i{color:var(--ok)}

  .ans{
    font-size:.66em;line-height:1.9;color:var(--ink-2);display:flex;gap:1.5em;align-items:center;
    padding:.15em 0 .3em;
  }
  .ans b{font-weight:700;margin-left:.3em}
  .ans .mine b{color:var(--bad)}
  .ans .right b{color:var(--ok)}

  .exp{font-size:.66em;line-height:1.65;color:var(--ink-2);padding:.18em 0 .12em}
  .exp em{font-style:normal;color:var(--ink);background:rgba(60,124,252,.08);border-radius:.2em;padding:0 .15em}

  /* 滚动条 */
  .sbar{
    position:absolute;right:.5em;top:4.4em;bottom:2.2em;width:.28em;z-index:5;
    background:rgba(50,52,58,.05);border-radius:1em;overflow:hidden;
  }
  .sbar i{position:absolute;left:0;right:0;background:rgba(50,52,58,.22);border-radius:1em}

  /* 浮层 */
  .tag{
    position:absolute;left:.95em;bottom:.8em;z-index:7;
    font-size:.64em;font-weight:500;padding:.4em .8em;border-radius:2em;
    background:rgba(255,255,255,.95);color:var(--ink-2);
    border:.07em solid var(--line);
    box-shadow:0 .2em .6em -.2em rgba(50,52,58,.25);
    display:flex;align-items:center;gap:.4em;
  }
  .tag .k{width:.5em;height:.5em;border-radius:50%;background:var(--ink-3)}
  .tag.on{background:var(--blue);color:#fff;border-color:var(--blue)}
  .tag.on .k{background:#fff}

  .state{
    position:absolute;right:.95em;bottom:.8em;z-index:8;
    font-size:.64em;font-weight:500;padding:.4em .8em;border-radius:2em;
    background:rgba(255,255,255,.95);border:.07em solid var(--line);
    color:var(--ink-3);
    box-shadow:0 .2em .6em -.2em rgba(50,52,58,.25);
    display:flex;align-items:center;gap:.42em;
  }
  .state .d{width:.5em;height:.5em;border-radius:50%;background:var(--ink-3)}
  .state.on{color:#1E9E7C;border-color:rgba(43,200,160,.45);background:rgba(43,200,160,.08)}
  .state.on .d{background:var(--ok)}

  .touch{
    position:absolute;left:0;top:0;width:.8em;height:.8em;border-radius:50%;
    background:rgba(60,124,252,.85);box-shadow:0 0 0 .28em rgba(60,124,252,.16);
    z-index:9;opacity:0;pointer-events:none;
  }
  .ring{
    position:absolute;left:0;top:0;width:.8em;height:.8em;border-radius:50%;
    border:.09em solid rgba(60,124,252,.6);z-index:9;opacity:0;pointer-events:none;
  }
  .flash{position:absolute;inset:0;background:#fff;z-index:20;opacity:0;pointer-events:none}

  .cap{margin:12px 2px 0;font-size:12.5px;color:var(--ink-2);display:flex;gap:14px;flex-wrap:wrap}
  .cap span{display:flex;align-items:center;gap:6px}
  .cap em{width:7px;height:7px;border-radius:50%;display:block;font-style:normal}
  .cap .a em{background:var(--bad)}
  .cap .b em{background:var(--ok)}
</style>
</head>
<body>
<script>if(location.search.indexOf('embed')>-1)document.body.classList.add('embed');</script>

<div class="wrap">
  <div class="head">
    <h1>演示 02 · 粉笔自由折叠</h1>
    <p>装完默认<b>全部收起，只剩题号</b>。题目 / 答案 / 解析 / 正确率 / 仅错题 五个开关各自独立，点哪个开哪个，再点一下就收回去。</p>
  </div>

  <div class="scene">
    <div class="stage">
      <div class="stage-in" id="scene">

        <div class="appbar">
          <span class="back">‹ 返回</span>
          <span class="ttl">言语理解与表达</span>
          <span class="done">已交卷</span>
          <span class="sp"></span>
          <span class="clock">02:13</span>
        </div>

        <div class="tabsrow">
          <span class="tab on">文字解析</span>
          <span class="tab">笔记</span>
          <span class="sp"></span>
          <span class="switches">
            <span class="sw" data-k="q"><i class="d"></i>题目</span>
            <span class="sw" data-k="a"><i class="d"></i>答案</span>
            <span class="sw" data-k="e"><i class="d"></i>解析</span>
            <span class="sw" data-k="r"><i class="d"></i>正确率</span>
            <span class="sw" data-k="w"><i class="d"></i>仅错题</span>
          </span>
        </div>

        <div class="paper" id="paper"><div class="scroller" id="scroller"></div></div>

        <div class="sbar"><i id="thumb"></i></div>

        <div class="tag" id="tag"><span class="k"></span><span id="tagText">原版粉笔</span></div>
        <div class="state" id="state"><span class="d"></span><span id="stateText">脚本关闭</span></div>

        <div class="touch" id="touch"></div>
        <div class="ring" id="ring"></div>
        <div class="flash" id="flash"></div>
      </div>
    </div>
  </div>

  <div class="cap">
    <span class="a"><em></em>原版：题目、答案、解析全部摊开，一屏只装得下一题，看下一题就得往下滚</span>
    <span class="b"><em></em>装后：默认只剩题号，五个开关点开哪个长哪个，最后只看错题</span>
  </div>
</div>

<script>
(function(){
  const sceneEl = document.getElementById('scene');
  const paper   = document.getElementById('paper');
  const scroller= document.getElementById('scroller');
  const touch   = document.getElementById('touch');
  const ring    = document.getElementById('ring');
  const flash   = document.getElementById('flash');
  const tag     = document.getElementById('tag');
  const tagText = document.getElementById('tagText');
  const stateEl = document.getElementById('state');
  const stateTx = document.getElementById('stateText');
  const thumb   = document.getElementById('thumb');
  const sws     = [...document.querySelectorAll('.sw')];

  const DATA = [
    { no:'12', rate:'62%', stem:'科学研究需要<span class="blank"></span>的态度，任何结论都应当经得起反复检验，而不是靠权威背书。',
      opts:['严谨','谨慎','苛刻','慎重'], mine:0, right:3,
      exp:'「严谨」与后文「反复检验」呼应，强调周密可靠、经得起推敲；「慎重」多用于决策取舍，此处不合语境。' },
    { no:'13', rate:'71%', stem:'面对复杂局面，他始终保持<span class="blank"></span>，在信息不全的情况下也能从容作出判断。',
      opts:['镇定','冷静','克制','沉默'], mine:1, right:1,
      exp:'「冷静」侧重临事不慌乱的心理状态，与「从容作出判断」直接对应；「镇定」多形容神情，范围偏窄。' },
    { no:'14', rate:'38%', stem:'这项政策的效果还需要更长时间检验，在数据充分之前不宜<span class="blank"></span>下结论。',
      opts:['贸然','轻易','草率','随便'], mine:2, right:0,
      exp:'「贸然」指轻率地、不加考虑地采取行动，与转折后的「还需时间检验」形成对照，是本题最关键的提示。' },
    { no:'15', rate:'54%', stem:'城市更新应当尊重既有街巷肌理和居民生活节奏，不能<span class="blank"></span>地大拆大建。',
      opts:['粗暴','简单','盲目','仓促'], mine:0, right:0,
      exp:'「粗暴」与「大拆大建」搭配最紧，且与「尊重肌理」构成正反对照；「盲目」侧重缺乏判断，与语境不吻合。' },
    { no:'16', rate:'45%', stem:'学术评价体系改革牵涉面广，需要循序渐进地推进，切忌<span class="blank"></span>。',
      opts:['急功近利','一蹴而就','好高骛远','朝令夕改'], mine:1, right:0,
      exp:'「切忌」提示后文应与「循序渐进」相反，「急功近利」指向追求短期效果，比「一蹴而就」更贴合语境。' },
    { no:'17', rate:'66%', stem:'乡村文化振兴不能只停留在修旧如旧，更要让传统村落<span class="blank"></span>。',
      opts:['焕发生机','重现生机','重返活力','复苏兴起'], mine:0, right:0,
      exp:'「焕发生机」强调恢复生命力，与递进关系「更要让…」呼应；「重现生机」与前文「修旧如旧」语义重复。' }
  ];

  scroller.innerHTML = DATA.map((d, i) => {
    const wrong = d.mine !== d.right;
    const opts = d.opts.map((o, j) => {
      const cls = j === d.right ? 'right' : (j === d.mine ? 'pick' : '');
      return `<span class="${cls}"><i>${'ABCD'[j]}</i>${o}</span>`;
    }).join('');
    return `
    <div class="q" data-i="${i}" data-wrong="${wrong ? 1 : 0}">
      <div class="qhead"><span class="no">${d.no}.</span>
        ${wrong ? '<span class="wrongtag">答错</span>' : ''}
        <span class="rate">全站正确率<b>${d.rate}</b></span><span class="sp"></span></div>
      <div class="blk" data-k="q">
        <div class="stem">${d.stem}</div>
        <div class="opts">${opts}</div>
      </div>
      <div class="blk" data-k="a">
        <div class="ans"><span class="mine">你的答案<b>${'ABCD'[d.mine]}</b></span><span class="right">正确答案<b>${'ABCD'[d.right]}</b></span></div>
      </div>
      <div class="blk" data-k="e">
        <div class="exp">${d.exp}</div>
      </div>
    </div>`;
  }).join('');

  const qs = [...scroller.querySelectorAll('.q')];
  const isWrong = qs.map(q => q.dataset.wrong === '1');
  const blocks = qs.map(q => ({
    q: q.querySelector('[data-k="q"]'),
    a: q.querySelector('[data-k="a"]'),
    e: q.querySelector('[data-k="e"]')
  }));
  const rates = qs.map(q => q.querySelector('.rate'));
  const wrongTags = qs.map(q => q.querySelector('.wrongtag'));

  // ---------------- 时间轴 ----------------
  const CYCLE = 11600;

  const TAP = [                 // 七次点击：五个开关全点一遍，再把题目/答案收回去
    { t:4800, sw:0 },   // 题目  开
    { t:5450, sw:1 },   // 答案  开
    { t:6100, sw:2 },   // 解析  开
    { t:6750, sw:3 },   // 正确率 开
    { t:7350, sw:4 },   // 仅错题 开
    { t:8150, sw:0 },   // 题目  关
    { t:8800, sw:1 }    // 答案  关
  ];
  const DUR = 380;

  const NAT = {};
  let snap = null;

  function em(){ return parseFloat(getComputedStyle(sceneEl).fontSize); }
  function clamp01(x){ return x < 0 ? 0 : x > 1 ? 1 : x; }
  function ease(x){ return x < .5 ? 2*x*x : 1 - Math.pow(-2*x + 2, 2)/2; }
  function seg(t,a,b){ return clamp01((t - a) / (b - a)); }

  function measure(){
    const e = em();
    blocks.forEach(b => { b.q.style.height = ''; b.a.style.height = ''; b.e.style.height = ''; });
    void paper.offsetHeight;
    blocks.forEach((b, i) => {
      NAT[i] = { q: b.q.offsetHeight / e, a: b.a.offsetHeight / e, e: b.e.offsetHeight / e };
    });
  }

  function swPos(i){
    const e = em();
    const s = sceneEl.getBoundingClientRect();
    const r = sws[i].getBoundingClientRect();
    return [ (r.left + r.width/2 - s.left) / e, (r.top + r.height/2 - s.top) / e ];
  }

  function render(t){
    const e = em();
    const before = t < 4000 || t >= 10850;
    const tt = t >= 10850 ? 0 : t;

    // ---- 五个开关的展开量（0=收起 1=展开）----
    let pQ = 0, pA = 0, pE = 0, pR = 0, pW = 0, scrollY = 0;

    if (before){
      pQ = pA = pE = 1; pR = 1;
      scrollY = -13.6 * ease(seg(tt, 500, 3300));
    } else {
      pQ = Math.max(0, ease(seg(t, TAP[0].t, TAP[0].t + DUR)) - ease(seg(t, TAP[5].t, TAP[5].t + DUR)));
      pA = Math.max(0, ease(seg(t, TAP[1].t, TAP[1].t + DUR)) - ease(seg(t, TAP[6].t, TAP[6].t + DUR)));
      pE = ease(seg(t, TAP[2].t, TAP[2].t + DUR));
      pR = ease(seg(t, TAP[3].t, TAP[3].t + DUR));
      pW = ease(seg(t, TAP[4].t, TAP[4].t + 420));
      scrollY = -1.6 * ease(seg(t, 9500, 10000));
      if (t >= TAP[4].t && snap === null) snap = qs.map(q => q.offsetHeight / e);
    }

    // ---- 板块高度：该收的收，该展的展 ----
    blocks.forEach((b, i) => {
      b.q.style.height = (pQ * NAT[i].q) + 'em';
      b.a.style.height = (pA * NAT[i].a) + 'em';
      b.e.style.height = (pE * NAT[i].e) + 'em';
    });

    // ---- 正确率徽章 / 答错标记 ----
    rates.forEach((r, i) => {
      r.style.opacity = pR;
      if (wrongTags[i]) wrongTags[i].style.opacity = pR;
    });

    // ---- 仅错题：做对的整卡收掉 ----
    qs.forEach((q, i) => {
      if (isWrong[i] || pW === 0){
        q.style.height = '';
        q.style.opacity = 1;
        q.style.paddingBottom = '';
        q.style.marginBottom = '';
        q.style.borderBottomColor = '';
        return;
      }
      const h = snap ? snap[i] : q.offsetHeight / e;
      q.style.height = ((1 - pW) * h) + 'em';
      q.style.opacity = 1 - pW;
      q.style.paddingBottom = ((1 - pW) * .3) + 'em';
      q.style.marginBottom = ((1 - pW) * .25) + 'em';
      q.style.borderBottomColor = pW > .5 ? 'transparent' : '';
    });

    scroller.style.transform = `translateY(${scrollY}em)`;

    // ---- 开关外观 ----
    const on = [pQ, pA, pE, pR, pW];
    sws.forEach((s, i) => {
      s.classList.toggle('on', on[i] > .5);
      s.style.opacity = before ? 0 : ease(seg(t, 4300 + i * 60, 4540 + i * 60));
    });

    // ---- 状态牌 ----
    stateEl.classList.toggle('on', !before);
    stateTx.textContent = before ? '脚本关闭' : '脚本开启';
    tag.classList.toggle('on', !before);
    tagText.textContent = before ? '原版粉笔' : '＋ 自由折叠';

    // ---- 滚动条 ----
    const viewH = paper.clientHeight;
    const contentH = qs.reduce((s, q) => s + q.offsetHeight, 0);
    const ratio = Math.min(1, viewH / contentH);
    thumb.style.height = (ratio * 100) + '%';
    const maxShift = Math.max(0, contentH - viewH);
    const prog = maxShift > 0 ? (-scrollY * e) / maxShift : 0;
    thumb.style.top = (clamp01(prog) * (1 - ratio) * 100) + '%';
    thumb.style.opacity = contentH <= viewH + 2 ? 0 : 1;

    // ---- 触点 ----
    let cx = 0, cy = 0, show = false;
    if (!before){
      for (let j = 0; j < TAP.length; j++){
        const t0 = TAP[j].t;
        if (t >= t0 - 230 && t <= t0 + 360){
          const p = swPos(TAP[j].sw);
          if (t < t0){
            const kk = ease(seg(t, t0 - 230, t0 - 10));
            cx = p[0] + (1 - kk) * 1.6;
            cy = p[1] + (1 - kk) * 1.3;
          } else { cx = p[0]; cy = p[1]; }
          show = true;
        }
      }
    }
    touch.style.opacity = show ? .95 : 0;
    if (show) touch.style.transform = `translate(${cx - .4}em, ${cy - .4}em)`;

    // ---- 涟漪 ----
    let ringA = 0, rx = 0, ry = 0;
    if (!before){
      for (let j = 0; j < TAP.length; j++){
        const kk = seg(t, TAP[j].t, TAP[j].t + 440);
        if (kk > 0 && kk < 1){
          const p = swPos(TAP[j].sw);
          ringA = 1 - kk; rx = p[0]; ry = p[1];
          ring.style.transform = `translate(${rx - .4}em, ${ry - .4}em) scale(${1 + kk * 2.3})`;
        }
      }
    }
    ring.style.opacity = ringA * .9;

    // ---- 转场 ----
    let a = 0;
    if (t < 300) a = 1 - seg(t, 0, 300);
    else if (t >= 3680 && t < 3880) a = seg(t, 3680, 3880);
    else if (t >= 3880 && t < 4080) a = 1;
    else if (t >= 4080 && t < 4320) a = 1 - seg(t, 4080, 4320);
    else if (t >= 10400 && t < 10650) a = seg(t, 10400, 10650);
    else if (t >= 10650) a = 1;
    flash.style.opacity = a;
  }

  let start = performance.now(), paused = false;
  function loop(now){
    if (!paused) render((now - start) % CYCLE);
    requestAnimationFrame(loop);
  }

  function boot(){
    measure();
    render(0);
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce){ render(9900); paused = true; return; }
    requestAnimationFrame(loop);
  }

  window.__setT = function(t){ paused = true; render(t); };
  window.addEventListener('resize', () => { measure(); snap = null; render(0); });

  if (document.readyState === 'complete') boot();
  else window.addEventListener('load', boot);
})();
</script>
